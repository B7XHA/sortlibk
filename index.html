here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            color: #4ade80;
        }

        .subtitle {
            color: #cbd5f5;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        #urlInput {
            flex: 1;
            padding: 18px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            outline: none;
            direction: ltr;
        }

        #shortenBtn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        #shortenBtn:hover {
            background: #16a34a;
            transform: scale(1.03);
        }

        .result {
            display: none;
            margin-top: 25px;
            background: #020617;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .short-link {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            direction: ltr;
            word-break: break-all;
        }

        .copy-btn {
            background: #4ade80;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        .ad-box {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 مختصر الروابط</h1>
    <p class="subtitle">اختصر روابطك عبر API مباشر وسريع</p>

    <div class="ad-box">
        <script src="https://pl28700469.effectivegatecpm.com/89/a6/b8/89a6b8558224cd67c0822829d68a87ad.js"></script>
    </div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="ضع الرابط هنا https://example.com">
        <button id="shortenBtn">اختصر الرابط</button>
    </div>

    <div class="result" id="resultBox">
        <h3>تم الاختصار بنجاح</h3>
        <div class="short-link" id="shortLink"></div>
        <button class="copy-btn" id="copyBtn">نسخ الرابط</button>
    </div>

    <div class="footer">
        موقع اختصار روابط عبر API مباشر
    </div>
</div>

<script>
const btn = document.getElementById("shortenBtn");
const input = document.getElementById("urlInput");
const resultBox = document.getElementById("resultBox");
const shortLinkDiv = document.getElementById("shortLink");
const copyBtn = document.getElementById("copyBtn");

btn.onclick = async () => {
    let url = input.value.trim();

    if (!url) {
        alert("ادخل رابط صحيح");
        return;
    }

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    try {
        new URL(url);
    } catch {
        alert("الرابط غير صالح");
        return;
    }

    try {
        const response = await fetch("https://cleanuri.com/api/v1/shorten", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!data.result_url) {
            alert("فشل الاتصال بالـ API");
            return;
        }

        shortLinkDiv.textContent = data.result_url;
        resultBox.style.display = "block";
        navigator.clipboard.writeText(data.result_url);

    } catch (err) {
        alert("خطأ في الاتصال بالـ API");
    }
};

copyBtn.onclick = () => {
    navigator.clipboard.writeText(shortLinkDiv.textContent);
    copyBtn.textContent = "تم النسخ ✓";
    setTimeout(() => {
        copyBtn.textContent = "نسخ الرابط";
    }, 2000);
};
</script>

</body>
</html>
