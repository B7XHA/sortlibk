<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط - Bitly</title>

    <!-- الخط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            color: #4ade80;
        }

        .subtitle {
            color: #cbd5f5;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        #urlInput {
            flex: 2;
            padding: 18px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            outline: none;
            direction: ltr;
        }

        #tokenInput {
            flex: 1;
            padding: 18px;
            border-radius: 50px;
            border: none;
            font-size: 14px;
            outline: none;
            direction: ltr;
            background: #f1f5f9;
            color: #000;
            min-width: 200px;
        }

        #shortenBtn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            flex: 0 0 auto;
        }

        #shortenBtn:hover {
            background: #16a34a;
            transform: scale(1.03);
        }

        .result {
            display: none;
            margin-top: 25px;
            background: #020617;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .short-link {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            direction: ltr;
            word-break: break-all;
        }

        .copy-btn {
            background: #4ade80;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        .copy-btn:hover {
            background: #22c55e;
        }

        .ad-box {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .note {
            background: #1e293b;
            padding: 10px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 14px;
            color: #cbd5e1;
            text-align: right;
        }

        .note a {
            color: #4ade80;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .input-group {
                flex-direction: column;
            }
            #tokenInput {
                width: 100%;
            }
            #shortenBtn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 مختصر الروابط</h1>
    <p class="subtitle">اختصار احترافي باستخدام Bitly API</p>

    <!-- إعلان علوي (خفيف) -->
    <div class="ad-box">
        <script src="https://pl28700469.effectivegatecpm.com/89/a6/b8/89a6b8558224cd67c0822829d68a87ad.js"></script>
    </div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="ضع الرابط هنا https://example.com">
        <input type="text" id="tokenInput" placeholder="أدخل Access Token الخاص بـ Bitly">
        <button id="shortenBtn">اختصر</button>
    </div>

    <!-- ملاحظة عن كيفية الحصول على token -->
    <div class="note">
        ℹ️ للحصول على Access Token: سجل في <a href="https://bitly.com" target="_blank">Bitly</a>، ثم اذهب إلى Settings > Developer Settings > Generic Access Token.
    </div>

    <!-- إعلان متوسط -->
    <div class="ad-box">
        <script async="async" data-cfasync="false"
            src="https://pl28700474.effectivegatecpm.com/596225155ab3da796681d551cb4b7cf4/invoke.js">
        </script>
        <div id="container-596225155ab3da796681d551cb4b7cf4"></div>
    </div>

    <div class="result" id="resultBox">
        <h3>تم الاختصار بنجاح</h3>
        <div class="short-link" id="shortLink"></div>
        <button class="copy-btn" id="copyBtn">نسخ الرابط</button>
    </div>

    <!-- إعلان سفلي خفيف -->
    <div class="ad-box">
        <script>
            atOptions = {
                'key': 'dcff8a2cffdf0642c627a5bacf3a04fd',
                'format': 'iframe',
                'height': 60,
                'width': 468,
                'params': {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/dcff8a2cffdf0642c627a5bacf3a04fd/invoke.js"></script>
    </div>

    <div class="footer">
        موقع اختصار روابط باستخدام Bitly API
    </div>

    <div class="footer">
        قناة المطور: https://t.me/Maro_hacker_eg
    </div>
</div>

<!-- إعلانات إضافية خفيفة خارج الصندوق -->
<script src="https://pl28700485.effectivegatecpm.com/ad/c0/62/adc06235d53a0b6f378838879d3f116a.js"></script>

<script>
    const btn = document.getElementById("shortenBtn");
    const input = document.getElementById("urlInput");
    const tokenInput = document.getElementById("tokenInput");
    const resultBox = document.getElementById("resultBox");
    const shortLinkDiv = document.getElementById("shortLink");
    const copyBtn = document.getElementById("copyBtn");

    btn.onclick = async () => {
        let url = input.value.trim();
        const token = tokenInput.value.trim();

        if (!url) {
            alert("الرجاء إدخال الرابط");
            return;
        }

        if (!token) {
            alert("الرجاء إدخال Access Token الخاص بـ Bitly");
            return;
        }

        if (!url.startsWith("http://") && !url.startsWith("https://")) {
            url = "https://" + url;
        }

        try {
            new URL(url);
        } catch {
            alert("الرابط غير صالح");
            return;
        }

        try {
            // Bitly API v4
            const response = await fetch("https://api-ssl.bitly.com/v4/shorten", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    long_url: url
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                alert("خطأ Bitly: " + (errorData.message || "تحقق من صحة الـ Token"));
                return;
            }

            const data = await response.json();
            const shortUrl = data.link; // الرابط المختصر

            shortLinkDiv.textContent = shortUrl;
            resultBox.style.display = "block";

            // نسخ الرابط تلقائياً (اختياري)
            navigator.clipboard.writeText(shortUrl);
        } catch (e) {
            alert("حدث خطأ في الاتصال: " + e.message);
        }
    };

    copyBtn.onclick = () => {
        navigator.clipboard.writeText(shortLinkDiv.textContent);
        copyBtn.textContent = "تم النسخ ✓";

        setTimeout(() => {
            copyBtn.textContent = "نسخ الرابط";
        }, 2000);
    };
</script>

</body>
</html>
