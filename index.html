<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مختصر الروابط - TinyURL</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;justify-content:center;align-items:center;padding:15px;color:#fff;}
.container{width:100%;max-width:850px;background:rgba(255,255,255,0.05);backdrop-filter:blur(15px);border-radius:25px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);text-align:center;}
h1{font-size:2.3rem;margin-bottom:10px;color:#4ade80;}
.subtitle{color:#cbd5f5;margin-bottom:25px;}
.input-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px;}
#urlInput{flex:1;padding:18px;border-radius:50px;border:none;font-size:16px;outline:none;direction:ltr;}
#shortenBtn{background:#22c55e;color:white;border:none;padding:18px 30px;border-radius:50px;font-size:18px;cursor:pointer;transition:0.3s;font-weight:bold;}
#shortenBtn:hover{background:#16a34a;transform:scale(1.03);}
.result{display:none;margin-top:25px;background:#020617;padding:20px;border-radius:20px;border:1px solid #334155;}
.short-link{background:#000;padding:15px;border-radius:12px;margin-bottom:15px;direction:ltr;word-break:break-all;}
.copy-btn{background:#4ade80;border:none;padding:12px 25px;border-radius:50px;cursor:pointer;font-weight:bold;}
.copy-btn:hover{background:#22c55e;}
.footer{margin-top:20px;font-size:13px;color:#94a3b8;}
</style>
</head>
<body>
<div class="container">
<h1>🔗 مختصر الروابط</h1>
<p class="subtitle">الآن مع TinyURL - تحويل مباشر</p>
<div class="input-group">
<input type="text" id="urlInput" placeholder="ضع الرابط هنا https://example.com">
<button id="shortenBtn">اختصر الرابط</button>
</div>
<div class="result" id="resultBox">
<h3>تم الاختصار بنجاح</h3>
<div class="short-link" id="shortLink"></div>
<button class="copy-btn" id="copyBtn">نسخ الرابط</button>
</div>
<div class="footer">موقع اختصار روابط - مجاني تماماً</div>
</div>

<script>
const btn=document.getElementById("shortenBtn");
const input=document.getElementById("urlInput");
const resultBox=document.getElementById("resultBox");
const shortLinkDiv=document.getElementById("shortLink");
const copyBtn=document.getElementById("copyBtn");

btn.addEventListener("click", async ()=>{
    let url=input.value.trim();
    if(!url){alert("الرجاء إدخال الرابط");return;}
    if(!url.startsWith("http://")&&!url.startsWith("https://")){url="https://"+url;}
    try{new URL(url);}catch(e){alert("الرابط غير صالح");return;}
    btn.disabled=true; btn.textContent="جارٍ الاختصار...";
    try{
        const response=await fetch(`https://api.tinyurl.com/create?url=${encodeURIComponent(url)}&domain=tiny.one`, {method:'GET'});
        if(!response.ok) throw new Error("فشل الاتصال بـ TinyURL");
        const shortUrl = await response.text(); // TinyURL API يرسل الرابط المختصر مباشرة
        shortLinkDiv.textContent = shortUrl;
        resultBox.style.display = "block";
    }catch(err){alert("حدث خطأ في الاتصال: "+err.message);}
    btn.disabled=false; btn.textContent="اختصر الرابط";
});

copyBtn.addEventListener("click", ()=>{
    navigator.clipboard.writeText(shortLinkDiv.textContent).then(()=>{
        copyBtn.textContent="تم النسخ ✓";
        setTimeout(()=>{copyBtn.textContent="نسخ الرابط";},2000);
    }).catch(()=>{alert("فشل النسخ، حاول مرة أخرى");});
});
</script>
</body>
</html>
